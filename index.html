<style>

<script>
(()=>{
const art=document.querySelector('.visual'),hand=document.querySelector('.hand'),coin=document.querySelector('.coin'),btn=document.querySelector('.primary'),later=document.querySelector('.later'),filled=document.querySelector('.filled'),glow=document.querySelector('.slot-glow');
const hero=document.querySelector('.hero-disc');
function fit(){document.documentElement.style.setProperty('--fit',Math.min(1,innerWidth/393,innerHeight/844));}fit();addEventListener('resize',fit);
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let start=performance.now(),wanted=0,progress=0,locked=false,retreat=0,capture=false,last=performance.now(),impactAt=-1;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
function render(t,dt=.016,demo=false){
if(demo){locked=t>=2.25;progress=locked?ease((t-2.47)/.9):0;retreat=locked?ease((t-3.37)/.8):0;}
else {progress+=(wanted-progress)*(1-Math.exp(-dt*6.5));const target=locked&&progress>.98?1:0;retreat+=(target-retreat)*(1-Math.exp(-dt*7));}
if(reduce.matches&&!demo){progress=wanted;retreat=locked?1:0;}
const approach=progress,seat=progress;const x=7.37*progress,y=12.55*progress;const ret=retreat;
const entry=reduce.matches?1:ease((t-.72)/.65);art.style.opacity=entry;art.style.transform='none';
const landAt=1.48;
const u=clamp((t-.28)/1.2),unfold=reduce.matches?1:u*u*u*(u*(u*6-15)+10);
const settle=clamp((t-landAt)/.42);
const contact=reduce.matches?0:Math.sin(settle*Math.PI*2)*Math.exp(-settle*4);
const size=1+1.7*(1-unfold);
hero.style.opacity=reduce.matches?'0':String(ease(t/.2)*(1-ease((t-1.98)/.26)));
hero.style.transform=`translate(${-7*(1-unfold)}px,${-110*(1-unfold)+contact*1.4}px) scale(${size*(1+contact*.045)},${size*(1-contact*.055)}) rotate(${-18*(1-unfold)}deg)`;
hero.style.filter=`drop-shadow(0 ${8*(1-unfold)+1}px ${12*(1-unfold)+2}px #2b6cfc22)`;
document.querySelector('.empty-third').style.opacity=reduce.matches?'0':String(1-ease((t-landAt)/.36));
const idle=reduce.matches?0:Math.sin(t*2*Math.PI/5.6)*1.7*(1-progress);
const arrival=reduce.matches?1:ease((t-1.05)/.6);const rowArrival=reduce.matches?1:ease((t-.72)/.65);document.querySelector('.base').style.transform='none';
const parts=document.querySelectorAll('.content h1,.content p,.content button');
parts.forEach((n,i)=>{const v=reduce.matches?1:ease((t-1.02-i*.085)/.55);n.style.opacity=String(v);n.style.translate=`0 ${(1-v)*7}px`;});
document.querySelectorAll('.decor').forEach((n,i)=>{const v=reduce.matches?0:Math.sin(t*2*Math.PI/(6.8+i)+i)*3.5;const dx=reduce.matches?0:Math.sin(t*2*Math.PI/(8.6+i)+i)*1.8;n.style.transform=`translate(${dx}px,${v}px)`;});
const cloudX=reduce.matches?0:Math.sin(t*2*Math.PI/9)*3;const cloudY=reduce.matches?0:Math.sin(t*2*Math.PI/7.4)*2.5;document.querySelector('.clouds').style.transform=`translate(${cloudX}px,${cloudY}px)`;
hand.style.transform=reduce.matches?'none':`translate(${x/.61-ret*28-(1-arrival)*10}%,${(y+idle/5.2)/.34-ret*25-(1-arrival)*12}%) rotate(${-2*approach+ret*5}deg)`;hand.style.opacity=String((1-ret)*arrival);coin.style.opacity=String(arrival);
if(demo)impactAt=t>=3.37?3.37:-1;
else if(locked&&progress>.97&&impactAt<0)impactAt=t;
const impactTime=impactAt<0?-1:t-impactAt;
const recoil=reduce.matches||impactTime<0?0:Math.sin(impactTime*21)*Math.exp(-impactTime*8.5);
coin.style.transform=`translate(${x/.147-(1-arrival)*41.5}%,${(y+idle/5.2)/(.147*.75)-(1-arrival)*37}%) scale(${(1+.07*seat)*(1-recoil*.075)})`;
filled.style.opacity=String(ease((seat-.5)/.5));glow.style.opacity=String(seat*(1-seat)*.25);coin.style.filter='drop-shadow(0 4px 6px #266cde25)';btn.setAttribute('aria-pressed',String(locked));
}
function tick(now){if(capture)return;render((now-start)/1000,Math.min((now-last)/1000,.05));last=now;requestAnimationFrame(tick)}
function cancel(){wanted=0;locked=false;impactAt=-1}
btn.addEventListener('click',()=>{wanted=1;locked=true;impactAt=-1;if(!reduce.matches){
btn.getAnimations().forEach(a=>a.cancel());
btn.animate([{transform:'scale(1)',backgroundColor:'#2b6cfc'},{transform:'scale(.93)',backgroundColor:'#2057dc',offset:.14},{transform:'scale(1.015)',backgroundColor:'#2b6cfc',offset:.5},{transform:'scale(1)',backgroundColor:'#2b6cfc'}],{duration:520,easing:'ease-out'});
const tap=document.querySelector('.touch');tap.getAnimations().forEach(a=>a.cancel());
tap.animate([{opacity:.9,transform:'translate(-50%,-50%) scale(.82)'},{opacity:.8,transform:'translate(-50%,-50%) scale(1.08)',offset:.4},{opacity:0,transform:'translate(-50%,-50%) scale(1.3)'}],{duration:600,easing:'ease-out'});
}});later.addEventListener('click',cancel);document.addEventListener('keydown',e=>{if(e.key==='r')cancel()});
window.__capture=t=>{document.body.classList.add('ready');capture=true;document.querySelector('.compare').style.display='none';
btn.style.transition='none';
const clickTime=t-2.25;
const press=clickTime<0?0:Math.sin(clickTime*22)*Math.exp(-clickTime*8);
btn.style.transform=`scale(${1-.085*press})`;
const shade=Math.max(0,press);btn.style.backgroundColor=`rgb(${43-11*shade},${108-23*shade},${252-25*shade})`;
const tap=document.querySelector('.touch');
const tapIn=t>=2.25?1:0,tapOut=ease((t-2.52)/.44);
const tapScale=t<2.25?1:.82+.48*ease((t-2.25)/.6);
tap.style.opacity=String(tapIn*(1-tapOut)*.9);tap.style.transform=`translate(-50%,-50%) scale(${tapScale})`;
render(t,.016,true)};Promise.all(Array.from(document.images,n=>n.decode().catch(()=>{}))).then(()=>{start=last=performance.now();document.body.classList.add('ready');requestAnimationFrame(tick)});
})();
